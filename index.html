<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <title>JiuTianJiuDi</title>
    <style>
        #gameFrame {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            aspect-ratio: 9 / 16;
        }

        @media screen and (min-width: 512px) and (min-height: 911px) {
            #gameFrame {
                width: 512px;
                height: 911px;
            }
        }

        @media screen and (max-width: 512px) {
            #gameFrame {
                width: 100%;
                height: calc((1vw * 16) / 9);
            }
        }

        @media screen and (max-height: 911px) {
            #gameFrame {
                /* width: 100%; */
                height: 100%;
            }
        }
    </style>
</head>

<body style="background-color: black;">
    <!-- <button onclick="openGame()">Open Game</button> -->

    <script>
        function openGame() {
            var iframe = document.createElement("iframe");
            iframe.src = "./ludo.html" + location.search;
            iframe.id = "gameFrame";
            document.body.appendChild(iframe);
        }

        function setIframeSize() {
            var iframe = document.getElementById('gameFrame');
            var windowWidth = window.innerWidth || document.documentElement.clientWidth;
            var windowHeight = window.innerHeight || document.documentElement.clientHeight;
            var aspectRatio = windowWidth / windowHeight;
            var desiredAspectRatio = 9 / 16; // Portrait aspect ratio (e.g., 9:16)

            if (aspectRatio > desiredAspectRatio) {
                // The device has a wider aspect ratio, scale iframe width
                iframe.style.width = '100%';
                iframe.style.height = 'auto';
            } else {
                // The device has a narrower aspect ratio, scale iframe height
                iframe.style.width = 'auto';
                iframe.style.height = '100%';
            }
        }
        openGame()
    </script>

</body>

</html>
